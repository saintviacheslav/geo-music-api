global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: geo
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-geo:8080"]

  - job_name: central
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-central:8080"]
